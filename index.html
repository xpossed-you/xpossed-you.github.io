        .cursor-outline {
    z-index: 99999;

<script>
const outline = document.querySelector('.cursor-outline');
let x = 0, y = 0;
let targetX = 0, targetY = 0;
let lastX = 0, lastY = 0;


// Track hover state
let hoveringAudioPlayer = false;

document.addEventListener("mousemove", e => {
  targetX = e.clientX;
  targetY = e.clientY;
});

// Detect hover on elements with class 'audio-player'
document.querySelectorAll('.audio-player').forEach(el => {
  el.addEventListener('mouseenter', () => hoveringAudioPlayer = true);
  el.addEventListener('mouseleave', () => hoveringAudioPlayer = false);
});

function animate() {
  const dx = targetX - lastX;
  const dy = targetY - lastY;

  // smooth follow
  x += (targetX - x) * 0.15;
  y += (targetY - y) * 0.15;

  outline.style.left = x + "px";
  outline.style.top = y + "px";

  // speed → stretch size
  const speed = Math.hypot(dx, dy);
  const stretch = Math.min(speed * 0.2, 30);

  const base = 20;
  const width = base + stretch;
  const height = base - stretch * 0.6;

  const angle = Math.atan2(dy, dx) * (180 / Math.PI);

  outline.style.width = `${width}px`;
  outline.style.height = `${height}px`;
  outline.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;

  // Fade out if hovering audio-player
  outline.style.opacity = hoveringAudioPlayer ? 0 : 1;

  lastX = x;
  lastY = y;

  requestAnimationFrame(animate);
}

animate();



</script>
